site_name: Hera Documentation
site_description: Deep technical reference and user guide for the Hera scientific data management platform
site_url: ""
repo_url: http://mathsrv2:8081/edenn/pyhera.git
repo_name: pyhera

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.instant
    - navigation.instant.progress
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/git-alt

plugins:
  - search
  - mkdocstrings:
      enabled: true
      default_handler: python
      handlers:
        python:
          paths:
            - .
          options:
            show_source: true
            show_root_heading: true
            heading_level: 3
            docstring_style: numpy
            show_signature_annotations: true
            members_order: source
            allow_inspection: true
  - mkdocs-jupyter:
      include_source: true
      execute: false

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting_started/installation.md
      - CLI Reference: cli/reference.md
  - Architecture:
      - Core Concepts: architecture/core_concepts.md
      - Data Layer: architecture/data_layer.md
  - Toolkits:
      - Toolkit Catalog: toolkits/overview.md
  - Examples:
      - Repository Examples: examples/repository_examples.md
      - Workflows: examples/workflows.md
  - Guides:
      - Best Practices: guides/best_practices.md
  - Testing:
      - Test Flow: testing/flow.md
  - Reference:
      - Cheat Sheet: reference/cheat_sheet.md
      - Repository Schema: reference/repository_schema.md
      - Environment Variables: configuration/env_vars.md
      - Glossary: glossary.md
      - Troubleshooting: troubleshooting.md
  - FAQ: faq.md
  - Tutorials:
      - Exploration Notebook: notebooks/exploration.ipynb
