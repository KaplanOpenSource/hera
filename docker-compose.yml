# Hera full stack.
#   docker compose up --build --watch                          -> mongo + server
#   docker compose --profile work up --build --watch           -> + client (Vite dev)
#   docker compose --profile work --profile ai up --build --watch -> + ollama, qdrant, cassandra, rag (internal)
#
# Safety: code folders are not mounted. Code is copied into the image, and
# --watch copies your edits in. Only data folders are mounted. No container
# runs as root, and all extra Linux rights are removed.
#
# The server finds Mongo via ~/.pyhera/config.json. We inject our own config
# (see the "configs" block below) so dbIP points at the "mongo" service name
# instead of the 127.0.0.1 baked into the image. The top key must match the
# Linux user name ("hera"), since hera picks its connection by that name.
name: hera-stack

x-locked-down: &locked-down
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

x-hera: &hera
  <<: *locked-down
  build:
    context: .
    dockerfile: dockerfile
    args:
      REQUIREMENTS: ${REQUIREMENTS:-requirements.txt}
  image: hera-server
  # uid 1000, same as the host user who owns the data folders.
  user: hera

# Named volumes: Docker creates them owned like the image folder, so no mkdir or chown.
volumes:
  qdrant-data:
  cassandra-data:
  rag-models:

configs:
  pyhera_config:
    content: |
      {
        "hera": {
          "dbIP": "mongo",
          "dbName": "olymp",
          "username": "hera",
          "password": "heracles"
        }
      }
  mongo_create_users:
    file: ./mongo-init.d/50-create-users.js
  # Cassandra logs only warnings and errors, to the console.
  cassandra_logback:
    content: |
      <configuration>
        <appender name="STDOUT" class="ch.qos.logback.core.ConsoleAppender">
          <encoder><pattern>%-5level %date{ISO8601} %F:%L - %msg%n</pattern></encoder>
        </appender>
        <root level="WARN"><appender-ref ref="STDOUT"/></root>
      </configuration>

services:
  mongo:
    <<: *locked-down
    image: mongo:5.0
    # The data folder already belongs to uid 999 (the mongodb user).
    user: "999:999"
    # --quiet drops the per-connection open/close log spam from the healthcheck.
    command: ["mongod", "--quiet"]
    volumes:
      - ./mongo-db-datadir:/data/db
    configs:
      - source: mongo_create_users
        target: /docker-entrypoint-initdb.d/50-create-users.js
    environment:
      MONGO_HERA_USER: hera
      MONGO_HERA_PWD: heracles
    # No ports: Mongo is only reachable by the server over the internal network.
    # Bare TCP port check: opens the socket and closes it, no handshake, so it
    # logs nothing on success. Fails (unhealthy) only when the port is down.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/27017"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    <<: *hera
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      # Data the server writes. Code comes from the image and --watch.
      - ./projects:/app/projects
      - ./notebooks:/app/notebooks
    configs:
      # Point hera at the mongo service instead of 127.0.0.1.
      - source: pyhera_config
        target: /home/hera/.pyhera/config.json
    environment:
      # Hermes is a submodule with no setup.py, so add it to the path.
      PYTHONPATH: /app:/app/hera/bin:/app/Hermes
      # jupyter-ai/langchain use this to reach the ollama service (started with
      # --profile ai). When ollama is not up, the name fails fast (100ms).
      OLLAMA_HOST: http://ollama:11434
      # The RAG server (started with --profile ai).
      RAG_API_URL: http://rag:8765
    # Bound to 127.0.0.1 so only this computer can reach them, not the LAN.
    ports:
      - "127.0.0.1:8000:8000"   # API
      - "127.0.0.1:8888:8888"   # Jupyter
      - "127.0.0.1:5678:5678"   # debugpy
    # --cors remote binds Jupyter to 0.0.0.0 so port 8888 is reachable from the host.
    command: python ui/server/server.py --cors remote
    develop:
      # The server has no auto reload, so restart it after each copy.
      watch:
        - action: sync+restart
          path: ./hera
          target: /app/hera
          ignore: [__pycache__/]
        - action: sync+restart
          path: ./ui/server
          target: /app/ui/server
          ignore: [__pycache__/, node_modules/, tests/]
        - action: sync+restart
          path: ./Hermes
          target: /app/Hermes
          ignore: [__pycache__/]
        - action: rebuild
          path: ./requirements.txt

  client:
    # Only starts with: docker compose --profile work up  (or: docker compose up client)
    <<: *hera
    profiles: ["work"]
    depends_on:
      - server
    working_dir: /client
    command: npm run dev -- --host
    ports:
      - "127.0.0.1:5173:5173"
    develop:
      # Vite reloads by itself, so a plain copy is enough.
      watch:
        - action: sync
          path: ./ui/client
          target: /client
          ignore: [node_modules/, dist/, data/]
        - action: rebuild
          path: ./ui/client/package-lock.json

  ollama:
    # Only starts with: docker compose --profile ai up
    # No ports: reachable only by the server over the internal network.
    <<: *locked-down
    profiles: ["ai"]
    image: ollama/ollama
    user: "1000:1000"
    environment:
      # Ollama keeps keys and models in $HOME/.ollama.
      HOME: /home/ollama
    volumes:
      - ./ollama-data:/home/ollama/.ollama
    # Bare TCP port check (no HTTP request), so GIN logs nothing on success.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/11434"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama-pull:
    # Runs once at ai startup: pulls the LLM, printing its size and percent every 2 s.
    <<: *locked-down
    profiles: ["ai"]
    image: python:3.11-slim
    user: "1000:1000"
    depends_on:
      ollama:
        condition: service_healthy
    command:
      - python
      - -c
      - |
        import json, time, urllib.request
        last = 0
        for line in urllib.request.urlopen("http://ollama:11434/api/pull", json.dumps({"model": "${RAG_OLLAMA_MODEL:-llama3}"}).encode()):
            m = json.loads(line)
            if m.get("total") and time.time() - last > 2:
                print(f"{m['total'] / 1e9:.1f} GB {100 * m.get('completed', 0) / m['total']:.3f}%", flush=True)
                last = time.time()
        print(m.get("status", m), flush=True)

  qdrant:
    # Vector store for the RAG. The unprivileged image runs as uid 1000.
    <<: *locked-down
    profiles: ["ai"]
    image: qdrant/qdrant:latest-unprivileged
    user: "1000:1000"
    depends_on:
      # Start after the model download, so its progress is not buried in logs.
      ollama-pull:
        condition: service_completed_successfully
    environment:
      # Keep snapshots in the mounted folder too.
      QDRANT__STORAGE__SNAPSHOTS_PATH: /qdrant/storage/snapshots
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/6333"]
      interval: 5s
      timeout: 5s
      retries: 20

  cassandra:
    # Text store for the RAG. Runs as the image's cassandra user (uid 999).
    <<: *locked-down
    profiles: ["ai"]
    image: cassandra:4
    user: "999:999"
    depends_on:
      # Start after the model download, so its progress is not buried in logs.
      ollama-pull:
        condition: service_completed_successfully
    environment:
      # Small heap; the default takes a quarter of the RAM.
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    volumes:
      - cassandra-data:/var/lib/cassandra
    configs:
      - source: cassandra_logback
        target: /etc/cassandra/logback.xml
    # Port 9042 opens only when Cassandra is ready, which takes about a minute.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9042"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  rag:
    # RAG API (FastAPI, port 8765). No ports: only the server talks to it.
    # Own small image (dockerfile.rag), so torch stays out of hera-server.
    <<: *locked-down
    profiles: ["ai"]
    build:
      context: .
      dockerfile: dockerfile.rag
    image: hera-rag
    user: hera
    depends_on:
      qdrant:
        condition: service_healthy
      cassandra:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    volumes:
      # Embedding model, downloaded once.
      - rag-models:/home/hera/rag-models
    environment:
      RAG_OLLAMA_BASE_URL: http://ollama:11434
      RAG_OLLAMA_MODEL: ${RAG_OLLAMA_MODEL:-llama3}
      # llama3 on CPU can take minutes per answer; the default 120s is too short.
      RAG_OLLAMA_TIMEOUT: "600"
      RAG_QDRANT_HOST: qdrant
      RAG_CASSANDRA_HOSTS: '["cassandra"]'
      RAG_MODELS_CACHE_DIR: /home/hera/rag-models
      # HuggingFace download cache, kept in the mounted folder.
      HF_HOME: /home/hera/rag-models/hf
    # Build the index when Qdrant has none yet, then start the API.
    command:
      - sh
      - -c
      - |
        set -eu
        python -c "import sys; from qdrant_client import QdrantClient; q = QdrantClient(host='qdrant'); sys.exit(0 if q.collection_exists('hera_docs') and q.count('hera_docs').count > 0 else 1)" \
          || hera-rag-search index --docs /app/docs --code /app/hera --clean
        exec python -m hera.utils.rag.serve
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8765"]
      interval: 5s
      timeout: 5s
      retries: 20
    develop:
      watch:
        - action: sync+restart
          path: ./hera
          target: /app/hera
          ignore: [__pycache__/]
        - action: sync
          path: ./docs
          target: /app/docs
        - action: rebuild
          path: ./setup.py
