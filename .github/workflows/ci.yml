name: CI

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (hermetic — no services)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout hera
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev gdal-bin

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install -r requirements-test.txt
          pip install -e . --no-deps

      # No MongoDB service and no S3 test data on purpose: this job proves
      # the unit layer is hermetic.  If it needs either, the seam in
      # hera/tests/unit/_seam.py is broken.
      - name: Run the unit layer
        run: pytest hera/tests/unit -m unit -q --cov=hera --cov-report=
        env:
          MPLBACKEND: Agg
          JUPYTER_PLATFORM_DIRS: "1"
          # A distinct filename, so the integration job can merge the two
          # halves without a collision.  pytest-cov folds its own parallel
          # fragments into this file at the end of the run, which is why there
          # is no `coverage combine` here -- with nothing left to merge it
          # exits 1 and would fail the job.
          COVERAGE_FILE: .coverage.unit

      - name: Report unit coverage
        run: coverage report
        env:
          COVERAGE_FILE: .coverage.unit

      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: .coverage.unit
          include-hidden-files: true

  test:
    name: Run full test suite
    runs-on: ubuntu-latest
    needs: unit

    env:
      HERA_DB_USER: hera
      HERA_DB_PASS: heracles
      HERA_DB_NAME: hera_ci
      # ubuntu-latest runner home is /home/runner; matches $HOME/hera_unittest_data
      # which is both bootstrap_unittest_data.sh's default and conftest's default.
      TEST_HERA: /home/runner/hera_unittest_data
      # Silence jupyter_client's platformdirs migration DeprecationWarning in test output
      JUPYTER_PLATFORM_DIRS: "1"
      # Arm the missing-data gate: a partial S3 download must fail the build
      # rather than skip dozens of tests and report green.
      HERA_REQUIRE_TEST_DATA: "1"

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: hera
          MONGO_INITDB_ROOT_PASSWORD: heracles
        options: >-
          --health-cmd "mongosh --quiet -u hera -p heracles --authenticationDatabase admin --eval 'db.runCommand({ ping: 1 }).ok' | grep -q 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout hera
        uses: actions/checkout@v4

      - name: Checkout hermes (internal dependency)
        uses: actions/checkout@v4
        with:
          repository: KaplanOpenSource/hermes
          path: _vendor/hermes
          # token: ${{ secrets.INTERNAL_REPO_PAT }}   # uncomment if private

      - name: Checkout pyargos (internal dependency — provides the `argos` package)
        uses: actions/checkout@v4
        with:
          repository: KaplanOpenSource/pyargos
          path: _vendor/pyargos
          # token: ${{ secrets.INTERNAL_REPO_PAT }}   # uncomment if private

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev gdal-bin

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install -e . --no-deps
          # hermes and pyargos are not pip-installable (no setup.py / pyproject.toml).
          # They expose the python packages `hermes` and `argos` at the clone root,
          # so we put their parent dirs on PYTHONPATH in the pytest step instead.

      - name: Write ~/.pyhera/config.json
        run: |
          mkdir -p "$HOME/.pyhera"
          python - <<'PY'
          import json, os, getpass
          cfg = {
              getpass.getuser(): {
                  "dbIP":     "127.0.0.1",
                  "dbName":   os.environ["HERA_DB_NAME"],
                  "username": os.environ["HERA_DB_USER"],
                  "password": os.environ["HERA_DB_PASS"],
              }
          }
          with open(os.path.expanduser("~/.pyhera/config.json"), "w") as f:
              json.dump(cfg, f, indent=4, sort_keys=True)
          print("wrote pyhera config for user:", getpass.getuser())
          PY

      - name: Wait for MongoDB
        run: |
          for i in {1..30}; do
            if (echo > /dev/tcp/127.0.0.1/27017) 2>/dev/null; then
              echo "MongoDB is up"; exit 0
            fi
            sleep 2
          done
          echo "MongoDB did not become available"; exit 1

      # ----- Test data from S3 (per scripts/s3/bootstrap_unittest_data.sh) -----
      - name: Resolve test data version
        id: tdv
        run: |
          VERSION=$(curl -fsSL --max-time 30 \
            "https://s3.eu-west-1.amazonaws.com/hera.kaplanopensource.co.il/latest.json" \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved test data version: $VERSION"

      - name: Cache test data
        id: cache-test-data
        uses: actions/cache@v4
        with:
          path: ${{ env.TEST_HERA }}
          key: hera-test-data-${{ steps.tdv.outputs.version }}

      - name: Fetch test data (cache miss)
        if: steps.cache-test-data.outputs.cache-hit != 'true'
        run: ./scripts/s3/bootstrap_unittest_data.sh --target-dir "$TEST_HERA"

      # --ignore, not -m "not unit": the two layers cannot share a pytest
      # process, because hera/tests/unit/conftest.py installs the mongomock
      # seam and moves HOME at collection time.  --ignore is what keeps the
      # new layer out; the marker must NOT also be excluded, because 147
      # pre-existing tests inside the integration files carry @pytest.mark.unit
      # and would then run in neither job.
      - name: Run full test suite
        run: pytest hera/tests/ -v -m "not notebook" --ignore=hera/tests/unit --cov=hera --cov-report=
        env:
          MPLBACKEND: Agg
          PYTHONPATH: ${{ github.workspace }}/_vendor/hermes:${{ github.workspace }}/_vendor/pyargos
          COVERAGE_FILE: .coverage.integration

      - name: Download unit coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-unit

      # Gated on the COMBINED measurement on purpose: gating on the unit layer
      # alone would reward mocking every boundary.
      - name: Enforce the coverage floor on the combined measurement
        run: |
          # combine merges every .coverage.* in the directory -- the unit half
          # just downloaded and the integration half from the step above --
          # into a single .coverage that the report then reads.
          coverage combine
          coverage report
          # First numeric line; the rest of the file documents the baseline.
          FLOOR="$(grep -oE '^[0-9]+' coverage_floor.txt | head -1)"
          echo "Enforcing combined coverage floor: ${FLOOR}%"
          coverage report --fail-under="${FLOOR}"
