name: CI

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    name: Run full test suite
    runs-on: ubuntu-latest

    env:
      HERA_DB_USER: hera
      HERA_DB_PASS: heracles
      HERA_DB_NAME: hera_ci
      # ubuntu-latest runner home is /home/runner; matches $HOME/hera_unittest_data
      # which is both bootstrap_unittest_data.sh's default and conftest's default.
      TEST_HERA: /home/runner/hera_unittest_data
      # Silence jupyter_client's platformdirs migration DeprecationWarning in test output
      JUPYTER_PLATFORM_DIRS: "1"

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: hera
          MONGO_INITDB_ROOT_PASSWORD: heracles
        options: >-
          --health-cmd "mongosh --quiet -u hera -p heracles --authenticationDatabase admin --eval 'db.runCommand({ ping: 1 }).ok' | grep -q 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout hera
        uses: actions/checkout@v6

      - name: Checkout hermes (internal dependency)
        uses: actions/checkout@v6
        with:
          repository: KaplanOpenSource/hermes
          path: _vendor/hermes
          # token: ${{ secrets.INTERNAL_REPO_PAT }}   # uncomment if private

      - name: Checkout pyargos (internal dependency — provides the `argos` package)
        uses: actions/checkout@v6
        with:
          repository: KaplanOpenSource/pyargos
          path: _vendor/pyargos
          # token: ${{ secrets.INTERNAL_REPO_PAT }}   # uncomment if private

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev gdal-bin

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install -e . --no-deps
          # hermes and pyargos are not pip-installable (no setup.py / pyproject.toml).
          # They expose the python packages `hermes` and `argos` at the clone root,
          # so we put their parent dirs on PYTHONPATH in the pytest step instead.

      - name: Write ~/.pyhera/config.json
        run: |
          mkdir -p "$HOME/.pyhera"
          python - <<'PY'
          import json, os, getpass
          cfg = {
              getpass.getuser(): {
                  "dbIP":     "127.0.0.1",
                  "dbName":   os.environ["HERA_DB_NAME"],
                  "username": os.environ["HERA_DB_USER"],
                  "password": os.environ["HERA_DB_PASS"],
              }
          }
          with open(os.path.expanduser("~/.pyhera/config.json"), "w") as f:
              json.dump(cfg, f, indent=4, sort_keys=True)
          print("wrote pyhera config for user:", getpass.getuser())
          PY

      - name: Wait for MongoDB
        run: |
          for i in {1..30}; do
            if (echo > /dev/tcp/127.0.0.1/27017) 2>/dev/null; then
              echo "MongoDB is up"; exit 0
            fi
            sleep 2
          done
          echo "MongoDB did not become available"; exit 1

      # ----- Test data from S3 (per scripts/s3/bootstrap_unittest_data.sh) -----
      - name: Resolve test data version
        id: tdv
        run: |
          VERSION=$(curl -fsSL --max-time 30 \
            "https://s3.eu-west-1.amazonaws.com/hera.kaplanopensource.co.il/latest.json" \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved test data version: $VERSION"

      - name: Cache test data
        id: cache-test-data
        uses: actions/cache@v6
        with:
          path: ${{ env.TEST_HERA }}
          key: hera-test-data-${{ steps.tdv.outputs.version }}

      - name: Fetch test data (cache miss)
        if: steps.cache-test-data.outputs.cache-hit != 'true'
        run: ./scripts/s3/bootstrap_unittest_data.sh --target-dir "$TEST_HERA"

      - name: Run full test suite
        run: pytest hera/tests/ -v -m "not notebook"
        env:
          MPLBACKEND: Agg
          PYTHONPATH: ${{ github.workspace }}/_vendor/hermes:${{ github.workspace }}/_vendor/pyargos

  ui-client:
    name: UI client checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ui/client

    steps:
      - name: Checkout hera
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ui/client/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The three steps below follow ui/client/TEST_UI.md, in order.
      - name: TypeScript type-checking
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test

      # Build to a temp dir so the checked-in ui/client/bundle stays untouched.
      - name: Production build
        run: npx vite build --outDir /tmp/hera-vite-build --emptyOutDir

  ui-server:
    name: UI server tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout hera
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ui/server/requirements-server.txt

      # The minimal server dependency set, not the repo-root requirements.txt.
      # The tests fake hera, so none of the heavy scientific stack is needed.
      - name: Install Python dependencies
        run: pip install -r ui/server/requirements-server.txt

      - name: Run UI server tests
        run: pytest tests -v
        working-directory: ui/server

  ui-integration:
    name: UI integration tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:latest
        # globalSetup.ts points hera at 27018 by default; HERA_INTEG_MONGO_PORT
        # can override it.
        ports:
          - 27018:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: hera
          MONGO_INITDB_ROOT_PASSWORD: heracles
        options: >-
          --health-cmd "mongosh --quiet -u hera -p heracles --authenticationDatabase admin --eval 'db.runCommand({ ping: 1 }).ok' | grep -q 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout hera
        uses: actions/checkout@v6

      - name: Checkout hermes (internal dependency)
        uses: actions/checkout@v6
        with:
          repository: KaplanOpenSource/hermes
          path: _vendor/hermes

      - name: Checkout pyargos (internal dependency — provides the `argos` package)
        uses: actions/checkout@v6
        with:
          repository: KaplanOpenSource/pyargos
          path: _vendor/pyargos

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ui/server/requirements-integ.txt

      # The integration set, not the repo-root requirements.txt. It is the server
      # dependencies plus the handful hera needs for the paths these tests drive.
      - name: Install Python dependencies
        run: |
          pip install -r ui/server/requirements-integ.txt
          pip install -e . --no-deps

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ui/client/package-lock.json

      - name: Install client dependencies
        run: npm ci
        working-directory: ui/client

      # globalSetup.ts starts the server itself on a free port, so hermes and
      # pyargos have to be importable by the child process it spawns.
      - name: Run integration tests
        run: |
          npx vitest run tests/integration -c vitest.integ.config.ts \
            --no-file-parallelism --retry 1 \
            --exclude '**/documents.integ.test.tsx' \
            --exclude '**/agentConfig.integ.test.tsx' \
            --exclude '**/deleteProject.integ.test.tsx' \
            --exclude '**/centralRepo.integ.test.tsx'
        working-directory: ui/client
        env:
          PYTHONPATH: ${{ github.workspace }}/_vendor/hermes:${{ github.workspace }}/_vendor/pyargos
